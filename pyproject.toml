[project]
name = "google-takeout-backup"
version = "0.2.0"
description = "Add your description here"
requires-python = ">=3.13"
dependencies = []

[dependency-groups]
proxy = [
    "eciespy",
    "eth-keys",
    "coincurve",
    "websockets",
]
manual-auth = [
    "invisible-playwright @ git+https://github.com/feder-cr/invisible_playwright.git",
    "transitions>=0.9.3",
]
backup = [
    "playwright==1.60.0",
    "transitions>=0.9.3",
]
browser = [
    "invisible-playwright @ git+https://github.com/feder-cr/invisible_playwright.git",
]
dev = [
    "playwright==1.60.0",
    "python-statemachine>=3.2.0",
    "ruff>=0.9.0",
]

[tool.ruff]
line-length = 120
target-version = "py313"

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"
