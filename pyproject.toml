[project]
name = "google-takeout-backup"
version = "0.2.3"
description = "Add your description here"
requires-python = ">=3.13"
dependencies = []

[dependency-groups]
manual-auth = [
    "undetected-geckodriver-lw>=2.1.0",
    "selenium>=4.10.0",
    "transitions>=0.9.3",
]
backup = [
    "selenium>=4.10.0",
    "transitions>=0.9.3",
    "cryptography>=43.0.0",
]
browser = [
    "undetected-geckodriver-lw>=2.1.0",
    "selenium>=4.10.0",
]
dev = [
    "undetected-geckodriver-lw>=2.1.0",
    "selenium>=4.10.0",
    "ruff>=0.9.0",
]

[tool.ruff]
line-length = 120
target-version = "py313"

[tool.ruff.lint]
extend-select = ["PLC0415"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"
