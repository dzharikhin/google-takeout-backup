services:
  backup:
    restart: no
    build:
      context: ..
      dockerfile: backup-server/Dockerfile
    env_file:
      - ../.env
      - .env
    tty: true
    volumes:
      - ./.auth_encoded:/app/.auth_encoded
      - ./downloads:/app/downloads
      - ./photos:/app/photos
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      BROWSER_SERVER_URL: ${BROWSER_SERVER_URL:-http://host.docker.internal:4444}
      ENCODED_PASS: ${ENCODED_PASS}
      GOOGLE_LANG: RU
      FILE_STREAM_KEY: ${FILE_STREAM_KEY}
