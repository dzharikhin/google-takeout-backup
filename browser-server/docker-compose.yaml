services:
  undetected-grid:
    restart: always
    image: gtb-undetected-grid:${VERSION:-latest}
    build:
      context: ..
      dockerfile: browser-server/Dockerfile.undetected_grid
    ports:
      - "4444:4444"
      - "4445:4445"
    volumes:
      - ./browser-downloads:/app/grid-downloads
      - ./browser-local-storage:/app/browser-local-storage
      - /tmp/.X11-unix:/tmp/.X11-unix
    deploy:
      resources:
        limits:
          memory: "${GRID_MEM_LIMIT:-4G}"
          cpus: "${GRID_CPU_LIMIT:-3}"
    environment:
      DISPLAY_MODE: ${DISPLAY_MODE:-virtual}
      DISPLAY: ${DISPLAY}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      FILE_STREAM_KEY: ${FILE_STREAM_KEY}
      SK: ${SK}
      PK: ${PK}
    healthcheck:
      test: ["CMD", "curl", "-fs", "http://localhost:4444/status"]
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 30s

  manual-auth:
    restart: no
    image: gtb-manual-auth:${VERSION:-latest}
    build:
      context: ..
      dockerfile: browser-server/Dockerfile.manual-auth
    depends_on:
      undetected-grid:
        condition: service_healthy
    network_mode: "service:undetected-grid"
    environment:
      DISPLAY_MODE: ${DISPLAY_MODE:-virtual}
      USER_E: ${USER_E}
      USER_P: ${USER_P}
    volumes:
      - ./browser-downloads:/app/browser-downloads
    profiles:
      - "manual"

