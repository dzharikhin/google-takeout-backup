services:
  undetected-grid:
    restart: always
    build:
      context: ..
      dockerfile: browser-server/Dockerfile.undetected_grid
    ports:
      - "4444:4444"
    volumes:
      - ./browser-downloads:/app/grid-downloads
      - ./browser-local-storage:/app/browser-local-storage
      - /tmp/.X11-unix:/tmp/.X11-unix
    environment:
      DISPLAY_MODE: ${DISPLAY_MODE:-virtual}
      DISPLAY: ${DISPLAY}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    healthcheck:
      test: ["CMD", "curl", "-fs", "http://localhost:4444/status"]
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 30s

  manual-auth:
    restart: no
    build:
      context: ..
      dockerfile: browser-server/Dockerfile.manual-auth
    depends_on:
      undetected-grid:
        condition: service_healthy
    network_mode: "service:undetected-grid"
    environment:
      DISPLAY_MODE: ${DISPLAY_MODE:-virtual}
      USER_E: ${USER_E}
      USER_P: ${USER_P}
    volumes:
      - ./browser-downloads:/app/browser-downloads
    profiles:
      - "manual"

