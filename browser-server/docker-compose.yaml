services:
  proxy:
    build:
      context: ..
      dockerfile: browser-server/Dockerfile.proxy
    restart: always
    ports:
      - "${PROXY_PUBLIC_PORT:-8082}:8080"
    environment:
      BROWSER_URL: ws://browser:${BROWSER_PORT}/srv
    networks:
      - secure_net
    profiles:
      - "headed"
      - "virtual"

  #  launch browser hosted on virtual display - stealth Firefox, less detection-prone
  browser-virtual:
    build:
      context: ..
      dockerfile: browser-server/Dockerfile.browser
    restart: always
    stdin_open: true
    tty: true
    environment:
      COMPOSE_PROFILES: virtual
      BROWSER_PORT: ${BROWSER_PORT:-8081}
      FP_SEED: ${FP_SEED:-42}
      FP_LOCALE: ${FP_LOCALE:-en-US}
      FP_TIMEZONE: ${FP_TIMEZONE:-}
      FP_HUMANIZE: ${FP_HUMANIZE:-true}
    volumes:
      - ./browser-local-storage/:/app/browser-local-storage
      - ./browser-downloads/:/app/browser-downloads
    networks:
      secure_net:
        aliases:
          - browser
    expose:
      - "${BROWSER_PORT}"
    profiles:
      - "virtual"

  #  launch browser headed - maybe for debug purposes
  browser-headed:
    build:
      context: ..
      dockerfile: browser-server/Dockerfile.browser
    restart: always
    environment:
      COMPOSE_PROFILES: headed
      BROWSER_PORT: ${BROWSER_PORT:-8081}
      FP_SEED: ${FP_SEED:-42}
      FP_LOCALE: ${FP_LOCALE:-en-US}
      FP_TIMEZONE: ${FP_TIMEZONE:-}
      FP_HUMANIZE: ${FP_HUMANIZE:-true}
      XDG_RUNTIME_DIR: /tmp
      WAYLAND_DISPLAY: ${WAYLAND_DISPLAY:-wayland-0}
    volumes:
      - ${XDG_RUNTIME_DIR}/${WAYLAND_DISPLAY:-wayland-0}:/tmp/${WAYLAND_DISPLAY:-wayland-0}
      - ./browser-local-storage/:/app/browser-local-storage
      - ./browser-downloads/:/app/browser-downloads
    devices:
      - /dev/dri:/dev/dri
    networks:
      secure_net:
        aliases:
          - browser
    expose:
      - "${BROWSER_PORT}"
    profiles: !override
      - "headed"

  browser-manual:
    build:
      context: ..
      dockerfile: browser-server/Dockerfile.manual-auth
    restart: no
    environment:
      HEADLESS_MODE: ${HEADLESS_MODE:-virtual}
      USER_E: ${USER_E}
      USER_P: ${USER_P}
      TIMEOUT_MILLIS: ${TIMEOUT_MILLIS:-30000}
      GOOGLE_LANG: EN
    volumes:
      - ./browser-downloads/:/app/browser-downloads
    profiles: ["manual"]

networks:
  secure_net:
    external: true
